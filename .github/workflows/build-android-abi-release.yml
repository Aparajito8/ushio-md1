name: Build Android ABI Release APKs

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android-abi-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Milkdown web assets
        run: |
          test -f assets/milkdown_web/index.html
          ls -la assets/milkdown_web/assets/


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload ABI APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-abi-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
